<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YB Accessories — Toptan Ürün Kataloğu</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding-bottom:180px;background:#f7f8f7;color:#25382f;font-family:Arial,sans-serif}
header{background:#a8d9c7;padding:26px 16px;text-align:center}
h1{margin:0;font-size:27px;letter-spacing:1px}
header p{margin-bottom:0}
main{max-width:1100px;margin:auto;padding:16px}
#categories{display:flex;gap:9px;overflow-x:auto;padding:8px 0 16px}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.chip{padding:12px 20px;border:1px solid #dce5df;border-radius:30px;background:white;color:#405648;white-space:nowrap}
.chip.active{background:#a8d9c7;border-color:#a8d9c7}
.tools{display:flex;gap:10px;margin-bottom:20px}
#search{flex:1;min-width:0;padding:14px;border:1px solid #e0e6e2;border-radius:14px;background:white}
#sort{max-width:145px;border:1px solid #e0e6e2;border-radius:14px;padding:10px;background:white}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{overflow:hidden;background:white;border:1px solid #e2e8e3;border-radius:20px;display:flex;flex-direction:column}
.photo{aspect-ratio:1;background:#f0efea;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.photo span{font-size:13px;color:#7b817c;text-align:center;padding:10px}
.details{padding:13px;flex:1;display:flex;flex-direction:column}
.details h2{font-size:17px;margin:0 0 7px;overflow-wrap:anywhere}
.category{font-size:13px;color:#7a877e;margin:0 0 12px}
.price{font-weight:bold;font-size:19px;margin:0 0 15px}
.quantity{display:flex;gap:6px;align-items:center;border-top:1px solid #edf0ed;padding-top:12px;margin-top:auto}
.quantity button{width:40px;height:42px;flex-shrink:0;border-radius:12px;background:#a8d9c7;font-size:23px;color:#254738}
.quantity input{width:100%;min-width:0;height:42px;border:1px solid #e0e6e2;border-radius:10px;text-align:center;font-size:17px;appearance:textfield}
.quantity input::-webkit-inner-spin-button{appearance:none}
.empty{grid-column:1/-1;padding:35px;text-align:center;color:#778379}
#cart{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dae5dd;padding:14px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #00000008}
.cart-inner{max-width:1068px;margin:auto}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
#count{font-size:13px;color:#778379;margin-top:5px}
#total{font-weight:bold;font-size:21px}
#order{width:100%;padding:15px;border-radius:12px;background:#157c60;color:white;margin-top:12px;font-weight:bold}
#order:disabled{background:#a9bbb1;cursor:default}
#status{line-height:1.5;color:#65766b}
@media(min-width:700px){
#products{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
}
@media(min-width:1000px){
#products{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
<h1>YB ACCESSORIES</h1>
<p>Toptan Ürün Kataloğu</p>
</header>

<main>
<nav id="categories" aria-label="Ürün kategorileri"></nav>
<div class="tools">
<input id="search" type="search" placeholder="Ürün ara..."
 aria-label="Ürün ara">
<select id="sort" aria-label="Ürünleri sırala">
<option value="default">En Yeni</option>
<option value="low">Fiyat: Artan</option>
<option value="high">Fiyat: Azalan</option>
</select>
</div>
<p id="status" role="status">Ürünler yükleniyor...</p>
<div id="products"></div>
</main>

<footer id="cart">
<div class="cart-inner">
<div class="cart-row">
<div>
<strong>Sepetim</strong>
<div id="count">0 ürün · 0 adet</div>
</div>
<div id="total">₺0,00</div>
</div>
<button id="order" disabled>WhatsApp ile Sipariş Ver</button>
</div>
</footer>

<script src="./yb-config.js"></script>
<script>
const $ = id => document.getElementById(id);
const phone = "905368362895";
const cart = new Map();
let products = [], category = "";

const money = value => Number(value).toLocaleString(
  "tr-TR", {style:"currency", currency:"TRY"}
);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function setQuantity(id, value) {
  let quantity = Number(value);
  quantity = Number.isFinite(quantity)
    ? Math.max(0, Math.min(99999, Math.floor(quantity))) : 0;
  if (quantity) cart.set(id, quantity);
  else cart.delete(id);
  updateCart();
  return quantity;
}

function updateCart() {
  let total = 0, units = 0, kinds = 0;
  products.forEach(product => {
    const quantity = cart.get(product.id) || 0;
    if (!quantity) return;
    kinds++;
    units += quantity;
    total += Math.round(Number(product.price) * 100) * quantity;
  });
  $("count").textContent = kinds + " ürün · " + units + " adet";
  $("total").textContent = money(total / 100);
  $("order").disabled = units === 0;
}

function renderCategories() {
  $("categories").replaceChildren();
  const names = ["", ...new Set(
    products.map(product => product.category).filter(Boolean)
  )];
  names.forEach(name => {
    const button = element(
      "button", "chip" + (category === name ? " active" : ""),
      name || "Tümü"
    );
    button.setAttribute("aria-pressed", String(category === name));
    button.onclick = () => {
      category = name;
      renderCategories();
      renderProducts();
    };
    $("categories").append(button);
  });
}

function renderProducts() {
  $("products").replaceChildren();
  const search = $("search").value.trim().toLocaleLowerCase("tr-TR");
  const visible = products.filter(product => {
    const text = (product.name + " " + product.category)
      .toLocaleLowerCase("tr-TR");
    return (!category || product.category === category)
      && (!search || text.includes(search));
  });

  if ($("sort").value === "low") {
    visible.sort((a, b) => Number(a.price) - Number(b.price));
  } else if ($("sort").value === "high") {
    visible.sort((a, b) => Number(b.price) - Number(a.price));
  }

  if (!visible.length) {
    $("products").append(element(
      "p", "empty",
      products.length ? "Aramana uygun ürün bulunamadı."
        : "Henüz ürün eklenmedi."
    ));
    return;
  }

  visible.forEach(product => {
    const card = element("article", "card");
    const photo = element("div", "photo");

    if (product.image) {
      const image = document.createElement("img");
      image.src = product.image;
      image.alt = product.name;
      image.loading = "lazy";
      image.onerror = () => {
        photo.replaceChildren(element(
          "span", "", "Fotoğraf yüklenemedi"
        ));
      };
      photo.append(image);
    } else {
      photo.append(element("span", "", "Fotoğraf hazırlanıyor"));
    }

    const details = element("div", "details");
    details.append(
      element("h2", "", product.name),
      element("p", "category", product.category),
      element("p", "price", money(product.price))
    );

    const controls = element("div", "quantity");
    const minus = element("button", "", "−");
    const plus = element("button", "", "+");
    const input = document.createElement("input");
    input.type = "number";
    input.inputMode = "numeric";
    input.min = "0";
    input.max = "99999";
    input.step = "1";
    input.value = cart.get(product.id) || 0;
    input.setAttribute("aria-label", product.name + " sipariş adedi");
    minus.setAttribute("aria-label", product.name + " adedini azalt");
    plus.setAttribute("aria-label", product.name + " adedini artır");

    minus.onclick = () => {
      input.value = setQuantity(
        product.id, (cart.get(product.id) || 0) - 1
      );
    };
    plus.onclick = () => {
      input.value = setQuantity(
        product.id, (cart.get(product.id) || 0) + 1
      );
    };
    input.oninput = () => {
      if (input.value === "") {
        setQuantity(product.id, 0);
      } else {
        input.value = setQuantity(product.id, input.value);
      }
    };
    input.onblur = () => {
      input.value = cart.get(product.id) || 0;
    };

    controls.append(minus, input, plus);
    details.append(controls);
    card.append(photo, details);
    $("products").append(card);
  });
}

$("search").oninput = renderProducts;
$("sort").onchange = renderProducts;

$("order").onclick = () => {
  const lines = ["Merhaba, YB Accessories sipariş talebim:", ""];
  let total = 0;
  products.forEach(product => {
    const quantity = cart.get(product.id) || 0;
    if (!quantity) return;
    const subtotal = Math.round(Number(product.price) * 100) * quantity;
    total += subtotal;
    lines.push(
      product.name + " — " + quantity + " adet",
      "Birim fiyat: " + money(product.price),
      "Tutar: " + money(subtotal / 100)
    );
    if (product.image) {
      lines.push("Ürün fotoğrafı: " + product.image);
    }
    lines.push("");
  });
  if (!cart.size) return;
  lines.push("Toplam: " + money(total / 100));
  const url = "https://wa.me/" + phone + "?text=" +
    encodeURIComponent(lines.join("\n"));
  window.open(url, "_blank", "noopener,noreferrer");
};

async function load() {
  try {
    const config = window.YB_CONFIG;
    if (!config || !config.url || !config.key) {
      throw new Error("Bağlantı ayarları yüklenemedi.");
    }

    const loaded = [];
    const pageSize = 500;
    let offset = 0;

    while (true) {
      const query = new URLSearchParams({
        select: "id,name,price,category,image",
        active: "eq.true",
        order: "created_at.desc,id.desc",
        limit: String(pageSize),
        offset: String(offset)
      });
      const response = await fetch(
        config.url + "/rest/v1/yb_products?" + query,
        {
          headers: {apikey: config.key},
          cache: "no-store"
        }
      );
      if (!response.ok) throw new Error("Ürünler alınamadı.");
      const page = await response.json();
      if (!Array.isArray(page)) throw new Error("Ürün listesi okunamadı.");
      loaded.push(...page);
      if (page.length < pageSize) break;
      offset += page.length;
    }

    products = loaded;
    $("status").textContent = "";
    renderCategories();
    renderProducts();
    updateCart();
  } catch (error) {
    $("status").textContent =
      "Ürünler yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.";
  }
}
load();
</script>
</body>
</html>
